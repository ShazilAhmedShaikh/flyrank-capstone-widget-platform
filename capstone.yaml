# FlyRank Capstone Manifest
version: "1.0"
project: "flyrank-capstone-widget-platform"
language: "python"
framework: "fastapi"

run: "python -m app.main"
seed: "python -m app.seed"
test: "pytest -v"
base_url: "http://localhost:8000"

endpoints:
  health: "GET /health"
  widget_script: "GET /widget.js"
  widget_bundle: "GET /static/widget.v1.js"
  widget_config: "GET /widgets/{id}/config"
  submit: "POST /submissions"
  preflight_submit: "OPTIONS /submissions"
  auth_register: "POST /api/auth/register"
  auth_login: "POST /api/auth/login"
  widgets_crud: "GET /api/widgets"
  dashboard_submissions: "GET /api/dashboard/submissions"
  dashboard_stats: "GET /api/dashboard/stats"
